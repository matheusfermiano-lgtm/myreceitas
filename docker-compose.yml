

services:
  db:
    image: mysql:8.0
    container_name: myreceitas_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: myreceitas_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./scripts:/docker-entrypoint-initdb.d
    networks:
      - myreceitas_net

  app:
    build: .
    container_name: myreceitas_app
    restart: always
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASS: root
      DB_NAME: myreceitas_db
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    networks:
      - myreceitas_net

networks:
  myreceitas_net:
    driver: bridge

volumes:
  db_data: